# FAST-LIO2 configuration for SimEnv Livox Mid-360 simulation
#
# This file is designed for the external FAST_LIO package:
#   https://github.com/hku-mars/FAST_LIO
#
# Prerequisite: clone FAST_LIO into the SimEnv workspace.
#   cd SimEnv/src
#   git clone https://github.com/hku-mars/FAST_LIO.git
#   cd FAST_LIO && git submodule update --init
#   cd ../..
#   ./tools/build_with_venv.sh
#   source devel/setup.bash

common:
  lid_topic: "/scan_pointcloud2"
  # Use trunk IMU (body-aligned, z-up) instead of LiDAR IMU (45 deg tilted).
  # The tilted IMU's initial gravity estimate is corrupted by body vibration,
  # causing pure-Z drift at ~62 m/s.
  imu_topic: "/trunk_imu"

preprocess:
  # 4=MARSIM/standard PointCloud2 path.  SimEnv's adapter publishes
  # sensor_msgs/PointCloud2, not livox_ros_driver/CustomMsg (type 1).
  lidar_type: 4
  scan_line: 4                 # Mid-360: 4 scan lines
  timestamp_unit: 0.0          # DISABLED — no per-point time in simulated /scan
  blind: 0.5                   # blind zone (m), matches sim laser_blind
  time_scale: 0.0              # no per-point time compensation

mapping:
  # SimEnv has a fixed LiDAR-to-IMU transform from robot.xacro.  Do not
  # estimate it online during stationary initialization.
  extrinsic_est_en: false
  acc_cov: 0.1                 # accelerometer measurement noise covariance
  gyr_cov: 0.1                 # gyroscope measurement noise covariance
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  fov_degree: 180
  det_range: 40.0              # max detection range (matches sim LiDAR max_range)

  # Extrinsic: LiDAR point coordinates -> IMU/body point coordinates.
  # FAST-LIO2 evaluates p_imu = extrinsic_R * p_lidar + extrinsic_T.
  # robot.xacro publishes imu_link -> laser_livox as [0.2, 0, 0.08],
  # Ry(+45°).  Because imu_link is body-aligned, this TF is already the
  # LiDAR->IMU coordinate transform that FAST-LIO2 consumes; do NOT invert it.
  extrinsic_T: [0.2, 0.0, 0.08]
  extrinsic_R: [0.7071, 0, 0.7071,
                0,      1,  0,
                -0.7071, 0, 0.7071]

  # LiDAR mounting: 45-degree pitch down on A1 base (robot.xacro:146 rpy="0 0.785 0").
  # This is the transform from base->laser_livox, documented for reference.
  # FAST-LIO2 handles this via extrinsic_T/extrinsic_R + IMU gravity alignment.
  #
  # Rotation responsibility boundary:
  #   URDF         — defines the 45° LiDAR tilt via laser_livox_joint
  #   adapter      — NO rotation (message type conversion only)
  #   FAST-LIO2    — extrinsic_R = Ry(+45°) maps LiDAR points into IMU/body
  #   bridge       — NO rotation (direct copy of map→imu_link as map→camera_init)
  # The 45° tilt is applied exactly ONCE: FAST-LIO2 maps LiDAR-frame points to
  # the body frame. Do NOT add any compensating rotation in the bridge.

  # Output
  publish:
    path_en: true
    scan_publish_en: true
    dense_publish_en: true
    scan_bodyframe_pub_en: true

  # Map saving
  pcd_save:
    pcd_save_en: true
    interval: -1                # save at end only

  filter_size_surf: 0.5
  filter_size_map: 0.5
  cube_side_length: 1000.0
  runtime_pos_log_enable: true

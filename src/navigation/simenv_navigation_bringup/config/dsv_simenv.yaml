drrt:
  gain:
    kFree: 0.0
    kOccupied: 0.0
    kUnknown: 1.0
    kMinEffectiveGain: 10
    kRange: 5
    kRangeZMinus: 0.4
    kRangeZPlus: 0.4
    kZero: 0.0
  tree:
    kExtensionRange: 0.8
    kMinExtensionRange: 0.6
    kMaxExtensionAlongZ: 0.08
    kExactRoot: false
    kGlobalExtraIterations_: 300
    kCuttoffIterations: 200
    kRemainingNodeScaleSize: 0.4
    kRemainingBranchScaleSize: 0.08
    kNewNodeScaleSize: 0.4
    kNewBranchScaleSize: 0.08
  vertexSize: 120
  keepTryingNum: 1
  kLoopCountThres: 1000
  tfFrame: map

planner:
  odomSubTopic: /navigation/state_estimation
  boundarySubTopic: /navigation/boundary
  terrainCloudSubTopic: /navigation/terrain_map
  newTreePathPubTopic: /navigation/dsv/new_tree_path
  remainingTreePathPubTopic: /navigation/dsv/remaining_tree_path
  boundaryPubTopic: /navigation/dsv/planning_horizon
  globalSelectedFrontierPubTopic: /navigation/dsv/global_selected_frontier
  localSelectedFrontierPubTopic: /navigation/dsv/local_selected_frontier
  plantimePubTopic: /navigation/dsv/plan_time
  nextGoalPubTopic: /navigation/dsv/next_goal
  randomSampledPointsPubTopic: /navigation/dsv/sampled_points
  shutDownTopic: /navigation/stop_exploring
  plannerServiceName: /navigation/drrtPlannerSrv
  cleanFrontierServiceName: /navigation/cleanFrontierSrv

interface:
  dtime: 1
  initX: 0
  initY: 0
  initZ: 0
  initTime: 1
  skipInitialMotion: true
  initializationTimeout: 5.0
  initializationDistanceTolerance: 0.15
  continueAfterInitializationTimeout: true
  returnHomeThres: 1.0
  robotMovingThres: 0.08
  movementWindow: 2.0
  movementDistanceThreshold: 0.08
  stuckTimeout: 15.0
  maxReplansBeforeFrontierClean: 2
  autoExp: false
  tfFrame: map
  waypointTopic: /navigation/way_point
  cmdVelTopic: /navigation/falco/cmd_vel_stamped
  graphPlannerCommandTopic: /navigation/graph_planner_command
  effectivePlanTimeTopic: /navigation/dsv/runtime
  totalPlanTimeTopic: /navigation/dsv/total_time
  gpStatusTopic: /navigation/graph_planner_status
  odomTopic: /navigation/state_estimation
  beginSignalTopic: /navigation/start_exploring
  stopSignalTopic: /navigation/stop_exploring

lb:
  kMinXLocal: -11.0
  kMinYLocal: -19.0
  kMinZLocal: -0.25
  kMaxXLocal: 11.0
  kMaxYLocal: 19.0
  kMaxZLocal: 0.25

gb:
  kMinXGlobal: -11.0
  kMinYGlobal: -19.0
  kMinZGlobal: -0.25
  kMaxXGlobal: 11.0
  kMaxYGlobal: 19.0
  kMaxZGlobal: 0.25

rm:
  kSensorPitch: 0.0
  kSensorHorizontal: 360.0
  kSensorVertical: 30.0
  kBoundX: 0.35
  kBoundY: 0.30
